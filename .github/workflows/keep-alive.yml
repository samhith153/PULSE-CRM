name: Keep Render Backend Warm

# Render free-tier web services spin down after ~15 minutes without inbound
# HTTP traffic; waking them costs 30-60s on the next request. This schedule
# pings the health endpoint every 10 minutes so the backend (and, via its own
# internal AI keep-alive job, the ai-service) stays warm.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 30 https://pulse-crm-backend.onrender.com/api/v1/health || true
