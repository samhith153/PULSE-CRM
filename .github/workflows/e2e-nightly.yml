name: E2E Tests (Nightly)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  e2e-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name pulse-crm-db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_DB=pulse_crm_nightly \
            -p 5432:5432 \
            postgres:16-alpine
          docker exec pulse-crm-db pg_isready -U postgres
          sleep 5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/pulse_crm_nightly
          SECRET_KEY: ci-nightly-secret-key
          ENVIRONMENT: development
        run: alembic upgrade head

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/pulse_crm_nightly
          SECRET_KEY: ci-nightly-secret-key
          ENVIRONMENT: development
          HOST: 0.0.0.0
          PORT: 8000
        run: uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        &

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v1/health/ping > /dev/null 2>&1; then
              echo "Backend ready!"
              break
            fi
            sleep 2
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ALL E2E tests (Chromium + Firefox)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          CI: true
        run: npx playwright test --project=chromium --project=firefox --reporter=html,json

      - name: Run performance tests
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          CI: true
        run: npx playwright test --project=performance --reporter=html,json

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-report-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test results JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-results-${{ github.run_id }}
          path: frontend/test-results.json
          retention-days: 30

      - name: Publish nightly summary
        if: always()
        run: |
          echo "## Nightly E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- [HTML Report](../artifacts/nightly-report-${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Test Results JSON](../artifacts/nightly-results-${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Stop PostgreSQL
        if: always()
        run: docker stop pulse-crm-db && docker rm pulse-crm-db
