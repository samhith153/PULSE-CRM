# Dedicated Postgres for the backend test suite.
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL="postgresql+asyncpg://pulse:pulse@localhost:5433/pulse_crm_test" pytest
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: pulse-crm-test-db
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse_crm_test
    ports:
      - "5433:5432"
    volumes:
      - pulse_crm_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse_crm_test"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pulse_crm_test_data:
